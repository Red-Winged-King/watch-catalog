name: Deploy static catalog

on:
  push:
    branches: [main]
    paths:
      - ".deployment_payload/**"
      - ".github/workflows/deploy-catalog.yml"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and commit site
        shell: bash
        run: |
          set -euo pipefail
          cat .deployment_payload/part-* > /tmp/watch-catalog.zip
          unzip -q /tmp/watch-catalog.zip -d /tmp/watch-catalog
          cp -a /tmp/watch-catalog/deploy_payload/. .
          rm -rf .deployment_payload
          rm -f .github/workflows/deploy-catalog.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish watch catalog and bulk calculator"
          git push
