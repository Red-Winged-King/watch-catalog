function money(n){return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(n)||0)}

function b64decode(payload){let b=String(payload||'').trim().replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';const bin=atob(b);return new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0)))}

function parseInput(raw){raw=String(raw||'').trim();if(!raw)throw Error('Paste an order code first.');let jsonText='';const first=raw.indexOf('{'),last=raw.lastIndexOf('}');if(first>=0&&last>first){jsonText=raw.slice(first,last+1)}else{let txt=raw.replace(/^[\'"`]+|[\'"`]+$/g,'').replace(/\s+/g,'');if(txt.includes('.'))txt=txt.slice(txt.lastIndexOf('.')+1);if(!/^[A-Za-z0-9_-]{12,}$/.test(txt)){const tokens=raw.match(/[A-Za-z0-9_-]{20,}/g)||[];if(!tokens.length)throw Error('Could not recognize that code.');tokens.sort((a,b)=>b.length-a.length);txt=tokens[0]}jsonText=b64decode(txt)}const p=JSON.parse(jsonText);if(!p||p.v!==1||!Array.isArray(p.items))throw Error('Unsupported code format.');return p.items}

function placementUnit(item,totalQty){const p=Number(item.supplierPrice);if(item.mappingStatus!=='mapped'||!Number.isFinite(p))return null;return round2((p*1.5)-(totalQty>=21?1:0))}

function allocatedPlacementUnitCost(item,t){const unit=placementUnit(item,t.q);if(unit==null||t.shipping==null)return null;const totalW=t.weight;if(!totalW)return unit;return round2(unit+t.shipping*(Number(item.shippingWeightKg)/totalW))}
function bulkBudget(budget){budget=Number(budget);if(!Number.isFinite(budget)||budget<=0)return{error:'Enter a budget.'};if(!bag.length)return{error:'Import an order first.'};if(hasPending(bag))return{error:'Budget helper needs confirmed price and weight for every selected item.'};const n=bag.length;let best=null;for(let total=n;total<=500;total++){const dist=proportionalDistribution(total);if(!dist)continue;const t=placementTotals(dist);if(t.total!=null&&t.total<=budget+1e-9){if(!best||total>best.totalQty||(total===best.totalQty&&t.shipPer<best.t.shipPer))best={dist,t,totalQty:total}}else if(best&&total>best.totalQty+50)break}if(!best)return{error:'Budget is below the estimated cost of one of each selected item.'};return best}
function shippingRecommendation(){const cur=placementTotals();if(cur.pending||cur.q<1||cur.shipping==null)return null;const start=cur.q;let candidate=null;const testTotals=[];if(start<21)testTotals.push(21);for(let n=start+1;n<=start+60;n++)if(!testTotals.includes(n))testTotals.push(n);for(const n of testTotals){if(n<=start)continue;const dist=proportionalDistribution(n);if(!dist)continue;const t=placementTotals(dist);if(t.shipping==null)continue;const good=t.shipPer<=cur.shipPer*.95 && t.shipShare<cur.shipShare;if(good){candidate={dist,t,totalQty:n,add:n-start};break}}return{cur,candidate}}
function renderItems(){const el=$('#items');if(!bag.length){el.innerHTML='<div class="empty">Import an order to see its items.</div>';return}const t=placementTotals();el.innerHTML=bag.map(x=>{const uc=allocatedPlacementUnitCost(x,t);return `<div class="item-row ${x.mappingStatus==='mapped'?'':'pending'}" data-sku="${x.sku}"><div class="sku">#${x.sku}</div><div class="item-main"><b>${x.bulkType}</b>${x.mappingStatus==='mapped'?'':'<small>Price pending</small>'}</div><div class="qtybox"><button type="button" data-d="-1">−</button><input inputmode="numeric" pattern="[0-9]*" value="${x.quantity}" aria-label="Quantity for item ${x.sku}"><button type="button" data-d="1">+</button></div><div class="unit"><span>Unit cost</span><b>${uc==null?'Pending':money(uc)}</b></div></div>`}).join('')}
function renderSummary(){const t=placementTotals();const m=[['Total watches',t.q],['Regular subtotal',t.pending?money(t.regularSubtotal)+' + pending':money(t.regularSubtotal)],['Bulk savings',t.savings?money(t.savings):'—'],['Watch total',t.pending?money(t.product)+' + pending':money(t.product)],['Estimated shipping',t.shipping==null?'Incomplete':money(t.shipping)],['Shipping / watch',t.shipPer==null?'Incomplete':money(t.shipPer)],['Shipping vs watch value',t.shipShare==null?'Incomplete':pct(t.shipShare)],['Unit cost / watch',t.unitCost==null?'Incomplete':money(t.unitCost),'total'],['Final total',t.total==null?'Incomplete':money(t.total),'total']];$('#summary').innerHTML=m.map(([a,b,c=''])=>`<div class="metric ${c}"><span>${a}</span><strong>${b}</strong></div>`).join('');$('#orderTitle').textContent=bag.length?`${bag.length} item${bag.length===1?'':'s'} · ${t.q} watches`:'Waiting for order';const missing=bag.filter(x=>x.mappingStatus!=='mapped');$('#status').className='status'+(missing.length?' warn':'');$('#status').textContent=bag.length?(missing.length?`Order loaded. ${missing.length} selected SKU${missing.length===1?' is':'s are'} pending supplier mapping; totals stay incomplete.`:`Order loaded. Only quantities can be changed.`):'No order imported.';renderShippingWarning()}
function renderShippingWarning(){const box=$('#shipAlert');if(!bag.length){box.className='alert hidden';box.innerHTML='';return}const r=shippingRecommendation();if(!r||r.cur.pending||r.cur.shipShare==null){box.className='alert hidden';box.innerHTML='';return}if(r.cur.shipShare<.40){box.className='alert hidden';box.innerHTML='';return}box.className='alert';if(r.candidate){box.innerHTML=`<strong>SHIPPING IS HIGH</strong><p>Estimated shipping is ${pct(r.cur.shipShare)} of watch value. Consider adding about <b>${r.candidate.add} more watches</b> in roughly the same mix. Shipping per watch could improve from <b>${money(r.cur.shipPer)}</b> to about <b>${money(r.candidate.t.shipPer)}</b>.</p>`}else{box.innerHTML=`<strong>SHIPPING IS HIGH</strong><p>Estimated shipping is ${pct(r.cur.shipShare)} of watch value. A larger order may improve shipping per watch, but no strong 5% improvement was found within the next 60 watches.</p>`}}
function renderBudget(){const box=$('#recommend'),budget=Number($('#budget').value);if(!budget){box.className='recommend hidden';box.innerHTML='';return}const r=bulkBudget(budget);if(r.error){box.className='recommend warn';box.innerHTML=`<h3>Budget helper</h3><p>${r.error}</p>`;return}box.className='recommend';box.innerHTML=`<h3>Suggested quantities</h3><p><b>${r.totalQty} watches</b> for about <b>${money(r.t.total)}</b>. Unit cost ≈ <b>${money(r.t.unitCost)}</b> and shipping ≈ <b>${money(r.t.shipPer)}/watch</b>. </p><div class="rec-list">${r.dist.map(x=>`<span class="rec-chip">#${x.sku} × ${x.quantity}</span>`).join('')}</div>`}
function renderAll(){renderItems();renderSummary();renderBudget()}
$('#import').addEventListener('click',()=>{try{importCode($('#code').value)}catch(e){$('#status').className='status warn';$('#status').textContent=e.message;toast('Could not import')}});$('#combineBtn').addEventListener('click',()=>{try{combineCode($('#combineCode').value);toast('Orders combined')}catch(e){const c=$('#combineStatus');c.className='combine-status warn';c.textContent=e.message;toast('Could not combine')}});$('#combineCode').addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter')$('#combineBtn').click()});$('#copy').addEventListener('click',()=>bag.length&&copyText(encodeCurrent()));$('#clear').addEventListener('click',()=>{bag=[];$('#code').value='';$('#combineCode').value='';$('#combineStatus').textContent='';$('#budget').value='';renderAll()});$('#items').addEventListener('click',e=>{const row=e.target.closest('.item-row');if(row&&e.target.matches('[data-d]'))changeQty(row.dataset.sku,Number(e.target.dataset.d))});$('#items').addEventListener('change',e=>{const row=e.target.closest('.item-row');if(row&&e.target.tagName==='INPUT')changeQty(row.dataset.sku,e.target.value,true)});$('#budget').addEventListener('input',renderBudget);$('#budgetBtn').addEventListener('click',renderBudget);renderAll();
</script></body></html>
